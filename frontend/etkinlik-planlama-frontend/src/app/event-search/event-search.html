<h2>Arama Sonucu ({{ totalElements() }}): {{ searchQuery() }}</h2>

@if (loading()) {
<div class="text-center" style="position: absolute;">
    <div class="spinner-border" role="status">
    <span class="visually-hidden">Loading...</span>
    </div>
</div>
}

<nav aria-label="Page navigation example">
  <ul class="pagination justify-content-end">
    @for (page of pages(); track page) {
        <li class="page-item"><a class="page-link" [class.active]="page === activePage()" role="button" (click)="searchEvents(page)">{{ page + 1 }}</a></li>
    }
  </ul>
</nav>

<div class="row">
    @for (item of eventArray(); track item.id) {
        <div class="col-sm-4 mb-3">
            <div class="card">
                                <div class="card-body d-flex align-items-center justify-content-between gap-2">
                                        <div>
                                            <h5 class="card-title">{{ item.title }}</h5>
                                            <p class="card-text mb-0">{{ item.category }}</p>
                                        </div>

                                        <div class="d-flex align-items-center gap-2">
                                            <app-favorite [eventId]="item.id" [isFavorite]="item.isFavorite" (toggled)="onFavoriteToggled(item, $event)"></app-favorite>
                                            <a [routerLink]="['/event/detail', item.id]" class="btn btn-primary">Detayları Gör</a>
                                        </div>
                                </div>
            </div>
        </div>
    }
</div>
