<button type="button" class="favorite-btn d-inline-flex align-items-center justify-content-center"
  [class.active]="isFavorite"
  [class.pop]="popping"
  (click)="toggle()"
  [attr.aria-pressed]="isFavorite"
  [attr.aria-label]="isFavorite ? 'Favoriden kaldır' : 'Favoriye ekle'">

  <ng-container *ngIf="!loading; else loadingTpl">
    <svg *ngIf="!isFavorite" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12.1 21.35l-1.1-.99C5.14 15.36 2 12.28 2 8.5 2 6 3.99 4 6.5 4c1.74 0 3.41.81 4.5 2.09C12.09 4.81 13.76 4 15.5 4 18.01 4 20 6 20 8.5c0 3.78-3.14 6.86-8.9 11.86l-1 1z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>

    <svg *ngIf="isFavorite" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 21.35l-1.1-.99C5.14 15.36 2 12.28 2 8.5 2 6 3.99 4 6.5 4c1.74 0 3.41.81 4.5 2.09C12.09 4.81 13.76 4 15.5 4 18.01 4 20 6 20 8.5c0 3.78-3.14 6.86-8.9 11.86L12 21.35z" fill="currentColor"/>
    </svg>
  </ng-container>

  <ng-template #loadingTpl>
    <span class="spinner-border spinner-border-sm text-light" role="status"></span>
  </ng-template>
</button>
